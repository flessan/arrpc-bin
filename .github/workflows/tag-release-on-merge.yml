name: Build and release after versioned PR merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true }}
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_command: dist:linux
          - os: windows-latest
            platform: windows
            build_command: dist:win
          - os: macos-latest
            platform: macos
            build_command: dist:mac

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build distributable
        run: npm run ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrpc-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event.pull_request.merged == true }}
    name: Tag and publish version bump
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check whether package version changed
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          BASE_VERSION="$(git show HEAD^:package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => console.log(JSON.parse(input).version))")"

          if [[ "$CURRENT_VERSION" == "$BASE_VERSION" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Package version did not change ($CURRENT_VERSION); no release will be created."
            exit 0
          fi

          TAG="v${CURRENT_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; leaving it unchanged."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: arrpc-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        if: ${{ steps.version.outputs.release == 'true' }}
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create version tag
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: release-assets/*
          generate_release_notes: true
