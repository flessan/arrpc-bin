name: Build and release arRPC Lite after merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true }}
    name: Test and package Lite client
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies only
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Create sub-1-MiB source package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          ARCHIVE="dist/arRPC-Lite-v${VERSION}.zip"
          node scripts/prepare-lite-package.mjs
          (cd dist/lite-package && zip -9 -r "../arRPC-Lite-v${VERSION}.zip" .)
          BYTES="$(wc -c < "$ARCHIVE")"
          echo "arRPC Lite archive size: $BYTES bytes"
          if [ "$BYTES" -ge 1048576 ]; then
            echo "Archive exceeds the 1 MiB target." >&2
            exit 1
          fi
          (cd dist && sha256sum "arRPC-Lite-v${VERSION}.zip" > SHA256SUMS)

      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: arrpc-lite
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event.pull_request.merged == true }}
    name: Publish unreleased Lite version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check whether this version has already been released
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${CURRENT_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; leaving it unchanged."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version ${CURRENT_VERSION} is not released yet."

      - name: Download Lite package
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: arrpc-lite
          path: release-assets

      - name: Publish GitHub Release
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: release-assets/*
          generate_release_notes: true
