name: Build and release after merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true }}
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_command: dist:linux
            artifact_path: "dist/*.AppImage"
          - os: windows-latest
            platform: windows
            build_command: dist:win
            artifact_path: "dist/*.exe"
          - os: macos-latest
            platform: macos
            build_command: dist:mac
            artifact_path: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build distributable
        run: npm run ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrpc-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event.pull_request.merged == true }}
    name: Publish unreleased package version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check whether this version has already been released
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          TAG="v${CURRENT_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; leaving it unchanged."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version ${CURRENT_VERSION} is not released yet."

      - name: Download platform artifacts
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: arrpc-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        if: ${{ steps.version.outputs.release == 'true' }}
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: release-assets/*
          generate_release_notes: true
