name: Build browser extensions

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arrpc-browser-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and package extensions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install helper dependency
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build browser extensions
        run: npm run build:extensions
      - name: Package browser ZIPs
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          (cd dist/chromium && zip -qr "../arrpc-chromium-v${VERSION}.zip" .)
          (cd dist/firefox && zip -qr "../arrpc-firefox-v${VERSION}.zip" .)
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: arrpc-browser-extensions
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension packages
        uses: actions/download-artifact@v4
        with:
          name: arrpc-browser-extensions
          path: release-assets
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
