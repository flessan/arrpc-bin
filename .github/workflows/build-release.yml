name: Build arRPC Lite

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arrpc-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and package lightweight client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies only
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Create sub-1-MiB source package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          ARCHIVE="dist/arRPC-Lite-v${VERSION}.zip"
          node scripts/prepare-lite-package.mjs
          (cd .lite-package-stage && zip -9 -r "$GITHUB_WORKSPACE/$ARCHIVE" .)
          BYTES="$(wc -c < "$ARCHIVE")"
          echo "arRPC Lite archive size: $BYTES bytes"
          if [ "$BYTES" -ge 1048576 ]; then
            echo "Archive exceeds the 1 MiB target." >&2
            exit 1
          fi
          rm -rf .lite-package-stage
          (cd dist && sha256sum "arRPC-Lite-v${VERSION}.zip" > SHA256SUMS)

      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: arrpc-lite
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Lite release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Lite package
        uses: actions/download-artifact@v4
        with:
          name: arrpc-lite
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
